{% extends "base.html" %}

{% block title %}{{ lesson.title }} — Навчайся легко{% endblock %}

{% block content %}
<div class="container" style="margin-top: 40px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
    <span style="color: #007bff; font-weight: bold;">Клас: {{ lesson.school_class }}</span>
    <h1>{{ lesson.title }}</h1>
    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
    
    <div class="lesson-content" style="line-height: 1.6; font-size: 18px;">
        {{ lesson.content|linebreaks|urlize }}
    </div>
    
    <div style="margin-top: 30px;">
        <a href="{% url 'course_list' %}" class="btn-secondary" style="text-decoration: none; color: #666; font-weight: 600;">← Назад до списку</a>
    </div>
</div>

<style>
    /* Стиль, щоб посилання в тексті виділялися */
    .lesson-content a {
        color: #007bff;
        text-decoration: underline;
        word-break: break-all; /* Щоб довгі посилання не ламали верстку */
    }
    .lesson-content a:hover {
        color: #0056b3;
    }
</style>
{% endblock %}
